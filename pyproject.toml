[build-system]
requires = ["scikit-build-core>=0.8", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "cdfmm"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
test = [
    "pytest",
    "matplotlib",
    # The tutorial tests parse the notebooks with nbformat and execute them
    # headlessly with nbclient on a generic python3 kernel.
    "nbformat",
    "nbclient",
    "ipykernel",
]
examples = [
    "matplotlib",
    "pandas",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
]

[tool.scikit-build]
cmake.args = ["-DCDFMM_BUILD_PYTHON=ON", "-DCDFMM_BUILD_TESTS=OFF", "-DCDFMM_BUILD_EXAMPLES=OFF"]
