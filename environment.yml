name: cdfmm
channels:
  - conda-forge
dependencies:
  # Python 3.11 is the reference development version; the package supports 3.9+.
  - python=3.11
  - pip
  - numpy
  - pytest
  # Interactive scientific examples and the VSCode-compatible notebook kernel.
  - matplotlib
  - pandas
  - jupyterlab
  - ipykernel
  - ipywidgets
  # CMake 3.25 introduced the CUDA::nvtx3 imported target.
  - cmake>=3.25
  - ninja
  # Intel oneAPI icpx is the reference high-performance C++20 compiler.
  - dpcpp_linux-64
  # Supply oneMKL headers, libraries, and MKLConfig.cmake for BLAS benchmarks.
  - mkl-devel
  # Supply omp.h and the LLVM OpenMP runtime used by icpx -fopenmp.
  - llvm-openmp
  - scikit-build-core>=0.8
  - pybind11>=2.13
  - sphinx>=7.2,<9
  - myst-parser>=2.0,<5
  - breathe>=4.35,<5
  - sphinx-rtd-theme>=2.0,<4
  - doxygen
