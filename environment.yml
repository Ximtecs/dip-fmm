name: cdfmm
channels:
  - conda-forge
dependencies:
  # Python 3.11 is the reference development version; the package supports 3.9+.
  - python=3.11
  - pip
  - numpy
  - pytest
  - cmake>=3.20
  - ninja
  # clangxx supplies a C++20-capable Clang driver rather than selecting a
  # system GCC installation.  See docs/installation.md for Windows caveats.
  - clangxx>=17
  - scikit-build-core>=0.8
  - pybind11>=2.13
  - sphinx>=7.2,<9
  - myst-parser>=2.0,<5
  - breathe>=4.35,<5
  - sphinx-rtd-theme>=2.0,<4
  - doxygen
